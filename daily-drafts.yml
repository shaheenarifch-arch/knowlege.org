name: daily-reviewed-content-drafts
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run content:daily
      - run: npm run newsletter:build
      - run: |
          git config user.name "Knowlege Editorial Bot"
          git config user.email "editorial@knowlege.org"
          git add content
          git commit -m "Create reviewed content drafts" || exit 0
          git push
